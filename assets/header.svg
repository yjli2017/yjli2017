  <style>
    .helix { animation: scroll 7s linear infinite; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-160px); } }
    .in { opacity: 0; animation: rise 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.45s; } .d3 { animation-delay: 0.8s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .grow { transform-origin: 70px 0; transform: scaleX(0); animation: grow 0.8s 0.3s ease-out forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .glow { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) { .helix, .glow { animation: none; } .in, .grow { animation-duration: 0.01s; animation-delay: 0s; } }
  </style>

